services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes: 
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0" # Start Vite, bind to localhost
    ports:
      - "5173:5173"  # For Vite
    networks:
      - appnet
  api:
    image: node:20-alpine
    working_dir: /api
    volumes:
      - ./api:/api
      - ./migrations:/migrations
    command: sh -c "npm install && npm run dev"
    ports:
      - "4000:4000"  # For GraphQL API
    environment:
      - DOCKER_ENV=true
      # PostgreSQL environment variables (used by both app and Postgrator)
      - PGHOST=db
      - PGPORT=5432
      - PGDATABASE=projectdb
      - PGUSER=testuser
      - PGPASSWORD=example
    depends_on:
      - db
    networks:
      - appnet
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_DB: projectdb
      POSTGRES_USER: testuser
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - appnet
volumes:
  db_data:
networks:
  appnet:
    driver: bridge
